name: CI coupling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coupling:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true

      - name: Create mock data
        run: python ci/make_mock_data.py

      - name: Run 1_coupling.py
        run: python 1_coupling.py --config ci/config_ci.yaml

      - name: Check sensitivity-index output
        run: test -f ci/data/outputs/sensitivity_index_SI_H_GLEAM_US.nc
